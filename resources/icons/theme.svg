<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gtheme" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="32" fill="#F5F7FA"/>
  <!-- 太阳光芒（6条射线） -->
  <rect x="122" y="52" width="12" height="20" rx="6" fill="url(#gtheme)"/>
  <rect x="122" y="184" width="12" height="20" rx="6" fill="url(#gtheme)"/>
  <rect x="52" y="122" width="20" height="12" rx="6" fill="url(#gtheme)"/>
  <rect x="184" y="122" width="20" height="12" rx="6" fill="url(#gtheme)"/>
  <rect x="72" y="72" width="20" height="12" rx="6" transform="rotate(45 82 78)" fill="url(#gtheme)"/>
  <rect x="164" y="72" width="20" height="12" rx="6" transform="rotate(-45 174 78)" fill="url(#gtheme)"/>
  <rect x="72" y="164" width="20" height="12" rx="6" transform="rotate(-45 82 170)" fill="url(#gtheme)"/>
  <rect x="164" y="164" width="20" height="12" rx="6" transform="rotate(45 174 170)" fill="url(#gtheme)"/>
  <!-- 中心圆（左半圆填充 + 右半圆镂空，形成日月交替） -->
  <circle cx="128" cy="128" r="44" fill="url(#gtheme)"/>
  <!-- 月牙叠加（深色遮罩，制造新月效果） -->
  <circle cx="108" cy="128" r="36" fill="#F5F7FA"/>
</svg>
